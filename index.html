<style>
:root{
  --azul:#0A2A6E; --azul-hondo:#061A47; --azul-claro:#1B4BA8; --oro:#F2B705; --oro-claro:#FFD23F; --blanco:#FFFFFF;
  --bg:#FFF4CC; --ink:#061A47; --muted:#3D4B78; --field:#FFFFFF; --line:#E2C45E; --chip:#0A2A6E; --chip-ink:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061A47; --ink:#FFF4CC; --muted:#AFC0E8; --field:#0E2A66; --line:#2B4C93; --chip:#F2B705; --chip-ink:#061A47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#061A47; --ink:#FFF4CC; --muted:#AFC0E8; --field:#0E2A66; --line:#2B4C93; --chip:#F2B705; --chip-ink:#061A47;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.screen{max-width:540px;margin:0 auto;padding:24px 20px 44px;display:flex;flex-direction:column;align-items:center}
[hidden]{display:none!important}

/* logo + título */
.crest{width:min(56vw,220px);height:auto;display:block;filter:drop-shadow(0 6px 0 rgba(6,26,71,.25))}
.wordmark{margin:14px 0 4px;text-align:center;font-family:"Bungee", Impact, "Arial Black", sans-serif;font-weight:400;line-height:.86;transform:rotate(-4deg)}
.wordmark span{display:block;color:var(--oro);-webkit-text-stroke:3px var(--azul-hondo);paint-order:stroke fill;text-shadow:5px 5px 0 var(--azul-hondo)}
.wordmark .w1,.wordmark .w3{font-size:clamp(2.2rem,11vw,3.3rem)}
.wordmark .w2{font-size:clamp(3.4rem,18vw,5.4rem);letter-spacing:-.01em}
.wordmark .w1{transform:translateX(-18%)}
.wordmark .w3{transform:translateX(18%)}
.sub{margin:18px 0 22px;color:var(--muted);font-weight:700;text-align:center}

/* modo */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;width:100%;border:3px solid var(--azul);border-radius:14px;overflow:hidden;margin-bottom:22px}
.modes button{border:0;padding:14px 8px;background:transparent;color:var(--ink);font-weight:800;font-size:1.05rem}
.modes button[aria-pressed="true"]{background:var(--azul);color:var(--oro)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .modes{border-color:var(--oro)}
  :root:not([data-theme="light"]) .modes button[aria-pressed="true"]{background:var(--oro);color:var(--azul-hondo)}}
:root[data-theme="dark"] .modes{border-color:var(--oro)}
:root[data-theme="dark"] .modes button[aria-pressed="true"]{background:var(--oro);color:var(--azul-hondo)}

.players{width:100%}
.players h2{font-size:1.05rem;margin:0 0 10px;font-weight:800}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:1.05rem}
.add button{padding:0 18px;border-radius:12px;border:0;background:var(--oro);color:var(--azul-hondo);font-weight:800;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px;padding:0;list-style:none}
.chips li{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 14px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-weight:700}
.chips li button{width:26px;height:26px;border-radius:50%;border:0;background:rgba(127,127,127,.25);color:inherit;line-height:1;font-size:1rem}
.hint{color:var(--muted);font-size:.92rem;min-height:1.3em;margin:4px 0 0}
.play{margin-top:22px;width:100%;padding:16px;border:3px solid var(--azul-hondo);border-radius:16px;background:var(--oro);color:var(--azul-hondo);
  font-family:"Bungee", Impact, sans-serif;font-size:1.5rem;box-shadow:0 6px 0 var(--azul-hondo)}
.play:active{transform:translateY(3px);box-shadow:0 3px 0 var(--azul-hondo)}
.play:disabled{opacity:.45;box-shadow:none}
.ghost{margin-top:12px;background:none;border:0;color:var(--muted);font-weight:800;text-decoration:underline;padding:8px}
.fine{color:var(--muted);font-size:.85rem;text-align:center;margin-top:22px;max-width:36ch}

/* equipos */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:6px}
.team{border-radius:16px;padding:14px 12px 16px}
.team:nth-child(1){background:var(--azul);color:#fff}
.team:nth-child(2){background:var(--oro);color:var(--azul-hondo)}
.team input{width:100%;background:transparent;border:0;border-bottom:2px dashed currentColor;color:inherit;font-family:"Bungee",Impact,sans-serif;font-size:1rem;padding:4px 0 6px;margin-bottom:10px}
.team ul{list-style:none;margin:0;padding:0;font-weight:700;font-size:1.05rem;line-height:1.7}
.teams-title{font-family:"Bungee",Impact,sans-serif;font-size:1.8rem;margin:10px 0 4px;text-align:center}

/* juego */
#game{position:fixed;inset:0;display:none;flex-direction:column;transition:background-color .3s ease;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#game.on{display:flex}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px}
.bar button{background:rgba(0,0,0,.2);color:inherit;border:0;border-radius:999px;padding:9px 15px;font-weight:800}
.count{font-weight:700;opacity:.85;font-size:.9rem;text-align:center}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 24px 28px;text-align:center;cursor:pointer;user-select:none;overflow:auto}
.kind{font-family:"Bungee",Impact,sans-serif;font-size:clamp(1.2rem,5.6vw,1.8rem);line-height:1.05;margin:0 0 22px;padding:8px 16px 6px;border-radius:8px;transform:rotate(-3deg);display:inline-block}
.text{font-size:clamp(1.35rem,5.6vw,2.05rem);line-height:1.3;font-weight:800;max-width:30ch;margin:0}
.tap{margin-top:30px;font-size:.9rem;opacity:.7;font-weight:700}
.win{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.win button{border-radius:12px;padding:12px 16px;font-weight:800;font-size:1rem;border:3px solid currentColor;background:transparent;color:inherit}
.win button[aria-pressed="true"]{background:var(--azul-hondo);color:var(--oro);border-color:var(--azul-hondo)}
.pop{animation:pop .26s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}#game{transition:none}}

/* familias de color: azul y oro */
.fam-azul{background:var(--azul);color:#fff}
.fam-azul .kind{background:var(--oro);color:var(--azul-hondo)}
.fam-azul .text b{color:var(--oro)}
.fam-hondo{background:var(--azul-hondo);color:#fff}
.fam-hondo .kind{background:#fff;color:var(--azul-hondo)}
.fam-hondo .text b{color:var(--oro)}
.fam-oro{background:var(--oro);color:var(--azul-hondo)}
.fam-oro .kind{background:var(--azul);color:var(--oro)}
.fam-oro .text b{color:var(--azul-claro)}
.fam-oro .bar button{background:rgba(6,26,71,.14)}
.fam-banda{background:linear-gradient(var(--azul) 0 22%, var(--oro) 22% 30%, var(--azul) 30%);color:#fff}
.fam-banda .kind{background:var(--oro);color:var(--azul-hondo)}
.fam-banda .text b{color:var(--oro)}
.endcrest{width:140px;margin-bottom:8px}
.score{font-family:"Bungee",Impact,sans-serif;font-size:1.3rem;margin:0 0 14px}
</style>
</head>

    ["voto","¿Quién es el más probable que termine en un cooler esta noche? A la cuenta de 3 apunten. El elegido toma un trago por cada dedo."],

    // ---- castigo máximo
    ["castigo","{A}, termínate el vaso. Sin preguntas."],
    ["castigo","El último en tirarse al suelo se termina el vaso."],
    ["castigo","{A} vs {B}: piedra, papel o tijera. El que pierda se termina el vaso."],
    ["castigo","El último que llegó a la previa se termina el vaso."],
    ["castigo","Exe se termina el vaso. Es su despedida, wn chucha wn."],

    // ---- especiales Exe
    ["exe","Exe reparte 6 tragos como quiera."],
    ["exe","Exe, haz 15 flexiones. Si las haces, reparte 5. Si no, toma 5."],
    ["exe","Exe elige a alguien para que se meta 10 segundos donde haya hielo. Si no quiere, toma 4."],
    ["exe","Exe, nombra 5 jugadores de la Selección campeona en 10 segundos. Toma 1 por cada uno que te falte."],
    ["exe","Exe elige a su compañero de copete hasta el final: cada vez que Exe tome, esa persona toma también."],
    ["exe","Exe toma 2 porque sí."],

    // ---- brindis
    ["brindis","Por Sher, la mejor quiltra. Todos levantan el vaso y toman un trago por ella."],
    ["brindis","Por Exe y Flo. Todos toman 2. Exe toma 4."],
    ["brindis","Por Boca. Los hinchas toman 3, los demás toman 1 igual."]
  ];

  // solo modo equipos. "reto" lleva botones para marcar qué equipo ganó.
  const TEAM_CARDS = [
    ["reto","Cultura chupística por equipos: <b>jugadores de Boca</b>. Alternen un nombre por equipo. El equipo que se quede pegado toma 3 cada uno."],
    ["reto","Cultura chupística por equipos: <b>marcas de cerveza</b>. Alternen. El equipo que se quede pegado toma 2 cada uno."],
    ["reto","Cultura chupística por equipos: <b>canciones de reggaetón</b>. Alternen. El equipo que se quede pegado toma 2 cada uno."],
    ["reto","Un representante de cada equipo juega piedra, papel o tijera. El equipo perdedor toma 2 cada uno."],
    ["reto","Pulseo: {A} contra {B}. El equipo perdedor toma 3 cada uno."],
    ["reto","Relevo: en cada equipo, uno por uno, toman un trago y dejan el vaso en la mesa antes de que siga el siguiente. El equipo que termine último toma 2 más cada uno."],
    ["reto","Plancha en equipo: todos al suelo. El equipo que se quede primero sin nadie en plancha toma 3 cada uno."],
    ["reto","Penales con una pelota de papel: un pateador de cada equipo, el arquero lo pone el rival. Tres tiros cada uno. El equipo con menos goles toma 2 cada uno."],
    ["reto","{A} y {B} se miran a los ojos. El primero en reírse hace perder a su equipo: 2 tragos cada uno."],
    ["reto","Trivia: ¿en qué año ganó Argentina su primer Mundial? El primer equipo en gritar la respuesta correcta gana. El otro toma 2 cada uno."],
    ["reto","Trivia: ¿cuántas Copas Libertadores tiene Boca? Cada equipo dice un número. El que quede más lejos toma 3 cada uno."],
    ["reto","Trivia: ¿cuántos kilómetros suma en total un triatlón olímpico? El equipo que quede más lejos toma 2 cada uno."],
    ["reto","Guerra de pulgares: {A} contra {B}. El equipo perdedor toma 2 cada uno."],
    ["reto","Castigo máximo: {A} contra {B}, piedra, papel o tijera. Todo el equipo perdedor se termina el vaso."],
    ["equipo","Todo {T} toma 2."],
    ["equipo","{T} elige a alguien de {O} para que tome 4."],
    ["equipo","El equipo que vaya perdiendo toma 3 cada uno. Si van empatados, toman todos 1."],
    ["equipo","{O} reparte 6 tragos entre los de {T}."],
    ["equipo","{A} se cambia de bando por una carta: toma con {O} la próxima vez que pierdan. Después vuelve a casa."]
  ];

  const VIRUS = [
    ["{A} habla con acento argentino hasta que termine el virus. Cada error es 1 trago.","{A} puede volver a hablar como chileno."],
    ["Nadie puede decir “Mikele”. El que la nombre toma 3.","Ya se puede decir Mikele. Con cuidado."],
    ["Cada vez que alguien diga “Boca”, todos gritan “¡Dale Booo!”. El último toma 1.","Se acabó el Dale Boo obligatorio."],
    ["Todos deben terminar sus frases con “mate”, como en Australia. El que se le olvide toma 1.","Ya no hay que decir mate."],
    ["Prohibido decir nombres: a todos se les dice “wn”. El que diga un nombre toma 2.","Ya pueden volver a decir nombres."],
    ["El que toque su celular toma 3.","Ya pueden usar el celular."],
    ["Solo se puede tomar con la mano izquierda. El que tome con la derecha, toma 2 más.","Ya se puede tomar con cualquier mano."],
    ["{A} es el maestro del pulgar: cuando ponga el pulgar en la mesa, todos tienen que hacer lo mismo. El último toma 2.","{A} ya no es el maestro del pulgar."],
    ["Exe no puede decir “sí” ni “no”. Cada vez que lo diga, toma 1.","Exe ya puede decir sí. Pronto se lo dice a Flo en el altar."]
  ];
  const TEAM_VIRUS = [
    ["Los de {T} solo pueden hablar con acento argentino. Cada error, 1 trago para todo su equipo.","{T} puede volver a hablar normal."],
    ["Cuando tome alguien de {O}, todo {T} grita “¡wn chucha wn!”. El último en gritar toma 1.","Se acabó el grito. Por ahora."]
  ];

  // ---------- estado
  let mode = "ind";
  let players = [];
  let teams = [[],[]], teamNames = ["Los del Cooler","Los de Cröl"];
  try { players = JSON.parse(localStorage.getItem("wcw-players") || "null") || ["Exe"]; } catch(e){ players = ["Exe"]; }
  try { const m = localStorage.getItem("wcw-mode"); if(m==="eq") mode = "eq"; } catch(e){}

  const $ = id => document.getElementById(id);
  const chips=$("chips"), hint=$("hint"), playBtn=$("playBtn"), nameIn=$("nameIn");
  const home=$("home"), teamsScreen=$("teamsScreen"), game=$("game"), wrap=$("cardWrap"), count=$("count");

  const save = () => { try{ localStorage.setItem("wcw-players", JSON.stringify(players)); localStorage.setItem("wcw-mode", mode); }catch(e){} };
  const minPlayers = () => mode==="eq" ? 4 : 2;

  function renderMode(){
    $("mInd").setAttribute("aria-pressed", mode==="ind");
    $("mEq").setAttribute("aria-pressed", mode==="eq");
    renderPlayers();
  }
  $("mInd").onclick = ()=>{ mode="ind"; save(); renderMode(); };
  $("mEq").onclick = ()=>{ mode="eq"; save(); renderMode(); };

  function renderPlayers(){
    chips.innerHTML = "";
    players.forEach((p,i)=>{
      const li = document.createElement("li"); li.textContent = p;
      const x = document.createElement("button");
      x.type="button"; x.textContent="×"; x.setAttribute("aria-label","Quitar a "+p);
      x.onclick = ()=>{ players.splice(i,1); save(); renderPlayers(); };
      li.appendChild(x); chips.appendChild(li);
    });
    const need = minPlayers();
    playBtn.disabled = players.length < need;
    playBtn.textContent = mode==="eq" ? "Armar equipos" : "Empezar";
    hint.textContent = players.length < need ? "Agreguen al menos " + need + " jugadores." : players.length + " jugadores listos.";
  }
  $("addForm").addEventListener("submit", e=>{
    e.preventDefault();
    const n = nameIn.value.trim(); if(!n) return;
    if(players.some(p=>p.toLowerCase()===n.toLowerCase())){ hint.textContent = n + " ya está en la lista."; return; }
    players.push(n); nameIn.value=""; save(); renderPlayers(); nameIn.focus();
  });

  // ---------- utilidades
  const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const rnd = a => a[Math.floor(Math.random()*a.length)];

  // ---------- equipos
  function drawTeams(){
    const s = shuffle(players.slice());
    teams = [[],[]];
    s.forEach((p,i)=>teams[i%2].push(p));
    renderTeams();
  }
  function renderTeams(){
    $("t0").value = teamNames[0]; $("t1").value = teamNames[1];
    [0,1].forEach(t=>{ $("l"+t).innerHTML = teams[t].map(p=>"<li>"+esc(p)+"</li>").join(""); });
  }
  $("t0").addEventListener("input", e=>{ teamNames[0] = e.target.value.trim() || "Equipo 1"; });
  $("t1").addEventListener("input", e=>{ teamNames[1] = e.target.value.trim() || "Equipo 2"; });
  $("reroll").onclick = drawTeams;
  $("teamsBack").onclick = ()=>{ teamsScreen.hidden = true; home.hidden = false; };
  $("teamsPlay").onclick = startGame;

  playBtn.addEventListener("click", ()=>{
    if(mode==="eq"){ home.hidden = true; teamsScreen.hidden = false; drawTeams(); window.scrollTo(0,0); }
    else startGame();
  });

  // ---------- mazo
  let deck=[], idx=0;
  function assign(c){
    if(mode==="eq"){
      const t = Math.random()<.5 ? 0 : 1;
      c.t = t;
      if(c.raw.includes("{A}") && c.raw.includes("{B}")){
        c.a = rnd(teams[t]); c.b = rnd(teams[1-t]);
      } else {
        const s = shuffle(players.slice()); c.a = s[0]; c.b = s[1];
        if(c.raw.includes("{A}") && (c.raw.includes("{T}")||c.raw.includes("{O}"))) c.a = rnd(teams[t]);
      }
    } else {
      const s = shuffle(players.slice()); c.a = s[0]; c.b = s[1] || s[0];
    }
  }
  function buildDeck(){
    let base;
    if(mode==="eq"){
      base = shuffle(CARDS.map(c=>({kind:c[0], raw:c[1]}))).slice(0,36)
        .concat(TEAM_CARDS.map(c=>({kind:c[0], raw:c[1]})));
      base = shuffle(base);
    } else {
      base = shuffle(CARDS.map(c=>({kind:c[0], raw:c[1]}))).slice(0,55);
    }
    const vpool = mode==="eq" ? shuffle(VIRUS.slice()).slice(0,3).concat(TEAM_VIRUS) : shuffle(VIRUS.slice()).slice(0,5);
    vpool.forEach(v=>{
      const pos = 2 + Math.floor(Math.random()*(base.length-16));
      base.splice(pos,0,{kind:"virus", raw:v[0], endRaw:v[1]});
    });
    base.forEach(assign);
    base.push({kind:"fin"});
    deck = base; idx = 0;
  }
  function fill(c, raw){
    return raw
      .replace(/\{A\}/g,"<b>"+esc(c.a)+"</b>").replace(/\{B\}/g,"<b>"+esc(c.b)+"</b>")
      .replace(/\{T\}/g,"<b>"+esc(teamNames[c.t||0])+"</b>").replace(/\{O\}/g,"<b>"+esc(teamNames[1-(c.t||0)])+"</b>");
  }
  // en modo equipos, retos y duelos (uno de cada equipo) suman al marcador
  function hasWinner(c){
    return mode==="eq" && (c.kind==="reto" || c.kind==="duelo" || (c.kind==="castigo" && c.raw.includes("{B}")));
  }
  function scores(){
    const s=[0,0]; deck.forEach(c=>{ if(c.winner===0||c.winner===1) s[c.winner]++; }); return s;
  }

  // ---------- pantalla de juego
  function crestSmall(){ return document.querySelector(".crest").outerHTML.replace('class="crest"','class="endcrest"'); }
  function show(){
    const c = deck[idx];
    if(c.kind==="virus" && !c.spawned){
      c.spawned = true;
      const at = Math.min(idx + 5 + Math.floor(Math.random()*6), deck.length-1);
      deck.splice(at,0,{kind:"finvirus", raw:c.endRaw, a:c.a, b:c.b, t:c.t});
    }
    const [label, fam] = KINDS[c.kind];
    game.className = "on fam-" + fam;
    let html = "";
    if(c.kind==="fin"){
      html = crestSmall() + '<p class="kind">Se acabó</p>';
      if(mode==="eq"){
        const s = scores();
        html += '<p class="score">' + esc(teamNames[0]) + " " + s[0] + " – " + s[1] + " " + esc(teamNames[1]) + "</p>";
        const txt = s[0]===s[1] ? "Empate. Toman los dos equipos, 3 cada uno." :
          "Pierde <b>" + esc(teamNames[s[0]<s[1]?0:1]) + "</b>: 3 tragos cada uno. Después, a la despedida.";
        html += '<p class="text">' + txt + "</p>";
      } else {
        html += '<p class="text">Se acabaron las cartas. Ahora sí: a la despedida. Wn chucha wn.</p>';
      }
    } else {
      html = '<p class="kind">' + label + '</p><p class="text">' + fill(c, c.raw) + "</p>";
      if(hasWinner(c)){
        const opts = (c.raw.includes("{A}") && c.raw.includes("{B}"))
          ? [[c.t, c.a + " (" + teamNames[c.t] + ")"], [1-c.t, c.b + " (" + teamNames[1-c.t] + ")"]]
          : [[0, teamNames[0]], [1, teamNames[1]]];
        html += '<div class="win" role="group" aria-label="¿Quién ganó?">' +
          opts.map(o=>'<button type="button" data-w="'+o[0]+'" aria-pressed="'+(c.winner===o[0])+'">Ganó '+esc(o[1])+'</button>').join("") + "</div>";
      }
    }
    wrap.innerHTML = html;
    wrap.classList.remove("pop"); void wrap.offsetWidth; wrap.classList.add("pop");
    if(mode==="eq" && c.kind!=="fin"){ const s=scores(); count.textContent = teamNames[0]+" "+s[0]+" – "+s[1]+" "+teamNames[1]; }
    else count.textContent = c.kind==="fin" ? "" : (idx+1) + " / " + (deck.length-1);
    $("tap").textContent = c.kind==="fin" ? "Toca para jugar de nuevo" : (hasWinner(c) ? "Marquen al ganador o toquen para seguir" : "Toca para seguir");
  }
  wrap.addEventListener("click", e=>{
    const b = e.target.closest("[data-w]"); if(!b) return;
    e.stopPropagation();
    deck[idx].winner = Number(b.dataset.w);
    idx++; show();
  });
  function next(){
    if(deck[idx].kind==="fin"){ buildDeck(); show(); return; }
    idx++; show();
  }
  function startGame(){
    buildDeck(); home.hidden = true; teamsScreen.hidden = true; show(); $("stage").focus();
  }
  $("stage").addEventListener("click", next);
  $("stage").addEventListener("keydown", e=>{ if(e.target.id==="stage" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); next(); } });
  $("backBtn").addEventListener("click", e=>{ e.stopPropagation(); if(idx>0){ idx--; show(); } });
  $("quitBtn").addEventListener("click", e=>{
    e.stopPropagation(); game.className = ""; teamsScreen.hidden = true; home.hidden = false;
  });

  renderMode();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
